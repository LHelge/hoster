# hoster configuration (ADR-0024).
#
# Install as ~/.config/hoster/hoster.toml for the hoster user ($XDG_CONFIG_HOME/hoster/hoster.toml),
# or point hoster at another file with `--config <path>`. Unknown keys are rejected.
#
# Every key can be overridden with a HOSTER_* environment variable, using `__` between nested keys:
#   HOSTER_ADMIN_HOST=hoster.example.com
#   HOSTER_ACME__DIRECTORY_URL=https://acme-staging-v02.api.letsencrypt.org/directory
#   HOSTER_PROXY__TIMEOUTS__READ=90s
#   HOSTER_UPSTREAM_PORTS__LAST=24999
# Environment variables win over this file; this file wins over the built-in defaults.
# Unknown HOSTER_* variables are rejected too, so a typo does not go unnoticed.
#
# Required in the environment, never in this file:
#   HOSTER_ADMIN_GITHUB=<your GitHub handle>   the only account allowed into the admin UI (ADR-0021)
#
# Secrets (OAuth client secret, registry credentials, secret-store key) never go in this file.
# They are read from separate 0600 files or systemd credentials ($CREDENTIALS_DIRECTORY, set by
# LoadCredential= in the unit).
#
# Logging verbosity is set with RUST_LOG (default "info"), e.g. RUST_LOG=hoster=debug. The proxy
# access log (target hoster::access) and deployment events (hoster::deploy) can be tuned on their
# own, e.g. RUST_LOG=info,hoster::access=off turns the access log off.
#
# Durations are humantime strings: "500ms", "30s", "5m", "1h 30m".
# Values shown are the defaults unless marked "required".

# Required. The reserved admin host serving the web UI and the deploy webhook (ADR-0031).
# A lowercase fully qualified domain name whose DNS points at this server.
admin_host = "hoster.example.com"

# Where hoster keeps its SQLite database, certificates, ACME account and admin socket.
# Must be absolute. Default: $XDG_DATA_HOME/hoster (~/.local/share/hoster).
# state_dir = "/home/hoster/.local/share/hoster"

# The rootless podman API socket, provided by the hoster user's `podman.socket` unit (ADR-0023).
# Must be absolute. Default: $XDG_RUNTIME_DIR/podman/podman.sock, then
# /run/user/$UID/podman/podman.sock. Rootful sockets and $DOCKER_HOST are never used.
# `hoster doctor` checks the same socket.
# podman_socket = "/run/user/1000/podman/podman.sock"

[acme]
# ACME directory. Let's Encrypt production by default; use staging for first runs:
#   "https://acme-staging-v02.api.letsencrypt.org/directory"
directory_url = "https://acme-v02.api.letsencrypt.org/directory"
# Contact e-mail registered with the ACME account (optional; a plain address, no "mailto:").
contact = "admin@example.com"
# hoster's public IP addresses for the advisory DNS check on app hosts (ADR-0051).
# Empty: resolve the admin host's A/AAAA records at startup and hourly.
public_addresses = []
# Root certificate (PEM) to trust for the ACME directory instead of the system roots. Only for
# test CAs such as Pebble (directory_url = "https://localhost:14000/dir"); leave unset otherwise.
# root_certificate = "/path/to/pebble.minica.pem"

# Loopback ports handed out round-robin to routed services (ADR-0026). Inclusive, within
# 1024-65535, at least 16 ports, and best kept clear of net.ipv4.ip_local_port_range.
[upstream_ports]
first = 20000
last = 29999

[proxy]
# Address of the plain-HTTP listener (ACME HTTP-01 challenges and redirects to HTTPS).
http_listen = "0.0.0.0:80"
# Address of the TLS listener that proxies to the routes. "[::]" also accepts IPv4 unless the
# host disables dual-stack sockets.
https_listen = "[::]:443"
# Pingora worker threads per listener. Default: the number of CPUs.
# threads = 2
# After a stop signal, how long in-flight requests may finish (Pingora grace_period_seconds).
# Both are whole seconds, and grace_period + graceful_shutdown_timeout must fit within the
# unit's TimeoutStopSec.
grace_period = "10s"
# Then, how long Pingora waits for its runtimes to stop (graceful_shutdown_timeout_seconds).
graceful_shutdown_timeout = "5s"

# Upstream timeouts for routes that don't set their own `timeouts` (ADR-0011).
[proxy.timeouts]
connect = "5s"
read = "60s"
write = "60s"
idle = "90s"

[poller]
# How often tracked tags are resolved to digests in the registry (ADR-0043). Jitter is added.
interval = "5m"

[webhook]
# The `aud` claim deploy webhook OIDC tokens must carry (ADR-0047).
# Default: "https://<admin_host>".
# audience = "https://hoster.example.com"

[web]
# The admin app listens on a 0600 Unix socket in state_dir (admin.sock) that the proxy forwards
# the admin host to (ADR-0031). For local development only, serve it on a loopback TCP address
# instead; it must be a loopback address.
# dev_listen = "127.0.0.1:8080"

# GitHub OAuth App for the admin login (ADR-0021, ADR-0031). Create it with the callback URL
# https://<admin_host>/auth/github/callback (http://<dev_listen>/auth/github/callback in
# development). Its client id and secret are read from the systemd credentials
# `github_client_id` and `github_client_secret` (LoadCredential= in the unit), or from these
# files (absolute paths, mode 0600), which win when set.
# github_client_id_file = "/home/hoster/.config/hoster/github_client_id"
# github_client_secret_file = "/home/hoster/.config/hoster/github_client_secret"
# An admin session ends after this long without a request, and 12h after login at the latest.
session_idle_timeout = "1h"

[log]
# hoster's own log lines on stderr (the user journal under systemd): "text" or "json" (one object
# per line, event fields at the top level, enclosing spans such as stack, service, generation and
# deployment_id under "spans").
format = "text"
