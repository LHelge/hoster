# hoster binds :80 and :443 as the unprivileged hoster user (ADR-0023).
#
# Install as /etc/sysctl.d/50-hoster.conf and apply with `sudo sysctl --system`.
# This one key covers IPv4 and IPv6 binds. It lets every local user bind ports 80-1023, so the
# host should not run other untrusted local users.
net.ipv4.ip_unprivileged_port_start = 80
