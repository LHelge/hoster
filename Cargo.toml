[package]
name = "hoster"
version = "0.1.0"
edition = "2024"
# MSRV: Pingora 0.9.1 needs 1.85. The development toolchain is pinned in rust-toolchain.toml.
rust-version = "1.85"
description = "Single-binary deployment orchestrator for one VPS: rootless podman, embedded proxy with ACME, zero-downtime deploys"
license = "MIT OR Apache-2.0"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
figment = { version = "0.10.19", features = ["toml", "env"] }
humantime = "2.4.0"
humantime-serde = "1.1.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_path_to_error = "0.1.20"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
figment = { version = "0.10.19", features = ["test"] }
insta = "1.49.0"

# Release binaries are built for x86_64-unknown-linux-musl, which links statically (ADR-0001):
#   cargo build --release --target x86_64-unknown-linux-musl
# See .github/workflows/release.yml and scripts/check-release-binary.sh.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
