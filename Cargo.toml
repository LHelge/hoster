[package]
name = "hoster"
version = "0.1.0"
edition = "2024"
# MSRV: sqlx 0.9 (ADR-0022) needs 1.94; Pingora 0.9.1 needs 1.85. The development toolchain is
# pinned in rust-toolchain.toml.
rust-version = "1.94"
description = "Single-binary deployment orchestrator for one VPS: rootless podman, embedded proxy with ACME, zero-downtime deploys"
license = "MIT OR Apache-2.0"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1.0.104"
askama = "0.16.1"
axum = "0.8.9"
bollard = "0.21"
clap = { version = "4.6.7", features = ["derive"] }
figment = { version = "0.10.19", features = ["toml", "env"] }
futures-util = "0.3.34"
humantime = "2.4.0"
humantime-serde = "1.1.1"
instant-acme = { version = "0.8.5", default-features = false, features = ["ring", "hyper-rustls", "rcgen", "time"] }
sd-notify = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net", "fs"] }
tokio-util = "0.7.20"
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
figment = { version = "0.10.19", features = ["test"] }
http-body-util = "0.1.5"
insta = "1.49.0"
nix = { version = "0.31.3", features = ["signal"] }
proptest = "1.11.0"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

# Release binaries are built for x86_64-unknown-linux-musl, which links statically (ADR-0001):
#   cargo build --release --target x86_64-unknown-linux-musl
# See .github/workflows/release.yml and scripts/check-release-binary.sh.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
