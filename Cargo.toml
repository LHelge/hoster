[package]
name = "hoster"
version = "0.4.0"
edition = "2024"
# The minimum is the toolchain pinned in rust-toolchain.toml: CI builds and checks with that
# version only. Raise both together.
rust-version = "1.99"
description = "Single-binary deployment orchestrator for one VPS: rootless podman, embedded proxy with ACME, zero-downtime deploys"
license = "MIT OR Apache-2.0"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.4"
askama = "0.16.1"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23.1"
bollard = "0.21"
bytes = "1.12.1"
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.7", features = ["derive"] }
figment = { version = "0.10.19", features = ["toml", "env"] }
form_urlencoded = "1.2.2"
futures-util = "0.3.34"
getrandom = "0.4.3"
http = "1.5.0"
humantime = "2.4.0"
humantime-serde = "1.1.1"
icondata = { version = "0.7.0", default-features = false, features = ["lucide"] }
instant-acme = { version = "0.8.5", default-features = false, features = ["ring", "hyper-rustls", "rcgen", "time", "x509-parser"] }
nix = { version = "0.31.3", features = ["hostname"] }
oauth2 = { version = "5.0.0", default-features = false }
pingora = { version = "0.9", default-features = false, features = ["proxy", "rustls"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "http2"] }
ring = "0.17.14"
rustix = { version = "1.1.6", features = ["process", "event"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7.1"
schemars = "1.2.3"
sd-notify = "0.5.0"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
sha2 = "0.11.1"
similar = "3.2.1"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["parsing"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net", "fs", "process", "io-util"] }
tokio-util = "0.7.20"
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
x509-parser = "0.18.1"

[dev-dependencies]
axum = { version = "0.8.9", features = ["ws"] }
figment = { version = "0.10.19", features = ["test"] }
http-body-util = "0.1.5"
insta = "1.49.0"
jsonschema = { version = "0.61.0", default-features = false }
nix = { version = "0.31.3", features = ["signal"] }
proptest = "1.11.0"
rcgen = "0.14.10"
tempfile = "3.27.0"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"

# Release binaries are built for x86_64-unknown-linux-musl, which links statically (ADR-0001):
#   cargo build --release --target x86_64-unknown-linux-musl
# See .github/workflows/release.yml and scripts/check-release-binary.sh.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
