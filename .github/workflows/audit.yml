name: Security audit

# RustSec advisories against Cargo.lock (Bears sng). hoster embeds its edge (Pingora, rustls, h2,
# instant-acme), so an advisory against a shipped dependency is fixed only by a hoster release.
#
# - The daily run sees advisories published against an unchanged lockfile. It opens one issue per
#   advisory (skipping any advisory already named in an issue title), because a failed scheduled
#   run would only mail whoever last edited this file.
# - Pushes to main and pull requests that change the dependencies, and manual runs, report a
#   "Security audit" check that fails on vulnerabilities. Unmaintained, unsound and yanked
#   crates are reported without failing.
#
# Ignored advisories live in .cargo/audit.toml, each with its reason.

on:
  schedule:
    - cron: "23 5 * * *"
  # Branches are checked through their PR; a push runs the audit only on main.
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - .cargo/audit.toml
      - .github/workflows/audit.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - .cargo/audit.toml
      - .github/workflows/audit.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Scheduled runs open issues; the others report a check run.
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@v7

      # rustup reads rust-toolchain.toml; the action installs cargo-audit with that toolchain.
      - name: Install toolchain
        run: rustup toolchain install

      # Pinned by commit: the action gets write access to issues. This is the default branch's
      # node24 build (rustsec/audit-check#48, 2026-03-20); v2.0.0, the newest tag, runs node20.
      - uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
