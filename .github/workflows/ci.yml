name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustup reads rust-toolchain.toml and installs the pinned toolchain with rustfmt and clippy.
      - name: Install toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --all-targets --locked

  msrv:
    name: MSRV (rust-version in Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The development toolchain in rust-toolchain.toml is newer than the declared minimum, so check
      # that the crate still builds on the `rust-version` it promises.
      - name: Install MSRV toolchain
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$msrv"
          rustup toolchain install "$msrv" --profile minimal
          echo "MSRV=$msrv" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo +"$MSRV" check --all-targets --locked

  static:
    name: static musl release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml lists the musl target. musl-tools provides musl-gcc for the C parts of
      # dependencies (ring, bundled libsqlite3).
      - name: Install toolchain and musl-tools
        run: |
          rustup toolchain install
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - uses: Swatinem/rust-cache@v2

      # ADR-0037: ring is the only crypto provider; aws-lc-rs must stay out of the tree.
      - name: No aws-lc-rs in the dependency tree
        run: scripts/check-no-aws-lc.sh

      - name: Build
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Check binary is static
        run: scripts/check-release-binary.sh target/x86_64-unknown-linux-musl/release/hoster
