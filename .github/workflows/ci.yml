name: CI

on:
  # Branches are checked through their PR; a push runs CI only on main.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustup reads rust-toolchain.toml and installs the pinned toolchain with rustfmt and clippy.
      - name: Install toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --all-targets --locked

  podman:
    name: zero-downtime deploy on rootless podman
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # ubuntu-latest ships podman; its rootless API socket is a systemd user unit.
      - name: Start the rootless podman socket
        run: |
          podman --version
          systemctl --user start podman.socket
          echo "HOSTER_PODMAN_SOCKET=/run/user/$(id -u)/podman/podman.sock" >> "$GITHUB_ENV"

      # ADR-0017 end to end: hoster's orchestrator and proxy in-process against real podman,
      # deploying under continuous load (src/e2e_tests.rs).
      - name: End-to-end deploy under load
        env:
          TEST_HOSTER_PODMAN: "1"
        run: cargo test --locked e2e_tests -- --nocapture

  systemd:
    name: systemd unit and sysctl drop-in
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # systemd-analyze verify on deploy/systemd/hoster.service (ADR-0023); prints the security
      # exposure report as well.
      - name: Check deploy/ systemd files
        run: scripts/check-systemd-units.sh --security

  release-script:
    name: release scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest ships shellcheck.
      - name: shellcheck
        run: shellcheck install.sh scripts/*.sh

      # scripts/release.sh prepare/tag against a bare local remote, with gh and git-cliff stubbed
      # (ADR-0052).
      - name: release.sh
        run: scripts/test-release.sh

  install-script:
    name: install.sh on a fresh host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # install.sh for real, as root, against fake file:// releases with a stub binary: fresh
      # install, idempotent re-run, updates and pruning, refused downgrade and checksum mismatch
      # (ADR-0052). The runner is disposable, so the hoster user and /etc changes are fine.
      - name: install.sh
        run: sudo HOSTER_INSTALL_TEST_DISPOSABLE=1 scripts/test-install.sh

  sqlx:
    name: sqlx offline metadata is up to date
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:${{ github.workspace }}/target/sqlx-check.db
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # Keep the CLI version in step with the sqlx dependency in Cargo.toml (ADR-0022).
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features sqlite

      # Start from an empty database: rust-cache restores target/, and a stale file with an
      # edited migration would fail on its checksum.
      - name: Create and migrate a scratch database
        run: |
          mkdir -p target
          rm -f target/sqlx-check.db*
          sqlx database create
          sqlx migrate run

      - name: Check .sqlx/
        run: cargo sqlx prepare --check -- --all-targets

  msrv:
    name: MSRV (rust-version in Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The development toolchain in rust-toolchain.toml is newer than the declared minimum, so check
      # that the crate still builds on the `rust-version` it promises.
      - name: Install MSRV toolchain
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$msrv"
          rustup toolchain install "$msrv" --profile minimal
          echo "MSRV=$msrv" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo +"$MSRV" check --all-targets --locked

  static:
    name: static musl release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml lists the musl target. musl-tools provides musl-gcc for the C parts of
      # dependencies (ring, bundled libsqlite3).
      - name: Install toolchain and musl-tools
        run: |
          rustup toolchain install
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - uses: Swatinem/rust-cache@v2

      # ADR-0037: ring is the only crypto provider; aws-lc-rs must stay out of the tree.
      - name: No aws-lc-rs in the dependency tree
        run: scripts/check-no-aws-lc.sh

      - name: Build
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Check binary is static
        run: scripts/check-release-binary.sh target/x86_64-unknown-linux-musl/release/hoster
