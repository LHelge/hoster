# Example release workflow for an app repository that deploys to hoster.
#
# Copy it to `.github/workflows/release.yml` in the app repository and adjust the `env` block.
# On every `v*` tag it builds the image, pushes it to ghcr and posts the pushed digest to
# hoster's deploy webhook, authenticated with the job's GitHub Actions OIDC token. No secret is
# needed. See docs/deploying-from-ci.md in the hoster repository.
#
# The stack file must allow this repository, e.g.
#
#   [deploy]
#   repository_id = 123456789        # gh api repos/OWNER/REPO --jq .id
#   refs = ["refs/tags/v*"]
#   environment = "production"
#
# and the service's `image` must be IMAGE below, without a tag.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # The repository the stack's service `image` names. ghcr names are lowercase.
  IMAGE: ghcr.io/acme/notes-api
  # The stack's `name` and the service the image belongs to.
  STACK: notes
  SERVICE: api
  # hoster's admin host; the audience is `https://<admin_host>` unless `[webhook] audience`
  # is set in hoster.toml.
  HOSTER_URL: https://hoster.example.com/hooks/deploy
  HOSTER_AUDIENCE: https://hoster.example.com

jobs:
  release:
    runs-on: ubuntu-latest
    # A GitHub environment limited to `v*` tags, optionally with required reviewers.
    # hoster checks the token's `environment` claim against the stack's `[deploy]` rule.
    environment: production
    permissions:
      contents: read
      packages: write   # push to ghcr with GITHUB_TOKEN
      id-token: write   # request an OIDC token for hoster
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=sha

      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64   # the VPS's architecture
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy to hoster
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail

          # A fresh, single-use token whose `aud` is hoster's audience.
          audience=$(jq -rn --arg a "$HOSTER_AUDIENCE" '$a|@uri')
          token=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$audience" | jq -r .value)
          echo "::add-mask::$token"

          # {"stack":"notes","images":{"api":"sha256:…"},"tag":"v1.4.2"}
          body=$(jq -nc --arg s "$STACK" --arg svc "$SERVICE" --arg d "$DIGEST" \
            --arg t "$GITHUB_REF_NAME" '{stack:$s, images:{($svc):$d}, tag:$t}')
          echo "request: $body"

          # 202: deployment accepted; 200: already running this digest. Anything else fails
          # the job with hoster's reason. Don't retry with the same token: it is single-use.
          status=$(curl -sS -o response.json -w '%{http_code}' -X POST "$HOSTER_URL" \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $token" \
            --data "$body")
          echo "response ($status): $(cat response.json)"
          case "$status" in
            200|202) ;;
            *) echo "::error::hoster refused the deploy ($status): $(cat response.json)"; exit 1 ;;
          esac

          id=$(jq -r .deployment_id response.json)
          echo "Deployment: ${HOSTER_URL%/hooks/deploy}/stacks/$STACK/deployments/$id" \
            >> "$GITHUB_STEP_SUMMARY"
