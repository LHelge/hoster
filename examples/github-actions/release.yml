# Example release workflow for an app repository that deploys to hoster.
#
# Copy it to `.github/workflows/release.yml` in the app repository and adjust `IMAGE` and the
# deploy step's inputs. On every `v*` tag it builds the image, pushes it to ghcr and deploys the
# pushed digest with hoster's deploy action, which authenticates with the job's GitHub Actions
# OIDC token. No secret is needed. See https://docs.hoster.lhelge.se/wiki/deploying-from-ci/.
#
# The stack file must allow this repository, e.g.
#
#   [deploy]
#   repository_id = 123456789        # gh api repos/OWNER/REPO --jq .id
#   refs = ["refs/tags/v*"]
#   environment = "production"
#
# and the service's `image` must be IMAGE below, without a tag. The stack is `notes` and the
# service `api`, as in the deploy step.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # The repository the stack's service `image` names. ghcr names are lowercase.
  IMAGE: ghcr.io/acme/notes-api

jobs:
  release:
    runs-on: ubuntu-latest
    # A GitHub environment limited to `v*` tags, optionally with required reviewers.
    # hoster checks the token's `environment` claim against the stack's `[deploy]` rule.
    environment: production
    permissions:
      contents: read
      packages: write   # push to ghcr with GITHUB_TOKEN
      id-token: write   # request an OIDC token for hoster
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=sha

      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64   # the VPS's architecture
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Use the release tag your hoster runs. `images` takes one `service=digest` per line;
      # services listed together deploy as one deployment. The step summary links it.
      - uses: LHelge/hoster/actions/deploy@v0.8.0
        with:
          url: https://hoster.example.com   # hoster's admin host
          stack: notes
          images: |
            api=${{ steps.push.outputs.digest }}
