# cargo-nextest (https://nexte.st): `cargo nextest run`. CI and the release workflow use the
# `ci` profile.

[profile.default]
# A test over this is reported as SLOW; none is killed for it.
slow-timeout = "30s"

[profile.ci]
# Run everything and report every failure, not just the first.
fail-fast = false
# No retries: a test that only passes on a second try is a bug to fix, in the test or in what
# it tests.
retries = 0
# A hung test fails after five minutes instead of running into the job's timeout.
slow-timeout = { period = "60s", terminate-after = 5 }

# The per-address cap is checked when a connection is accepted and its slot is taken a moment
# later in the connection's task, so a burst gets past it by however far the accept loop runs
# ahead: about 3 on an idle machine, 80 under a loaded CI runner. The test measures the idle
# figure, so it runs alone (OQ-44).
[[profile.default.overrides]]
filter = "test(=proxy::tests::limits::a_burst_from_one_address_overshoots_its_cap_by_little)"
threads-required = "num-test-threads"
